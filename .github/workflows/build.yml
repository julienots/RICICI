name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire jarvis-android-project.zip
        run: |
          unzip -o jarvis-android-project.zip -d extracted
          ROOT=$(find extracted -maxdepth 4 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "❌ settings.gradle.kts introuvable dans le zip"
            exit 1
          fi
          echo "Racine du projet détectée : $ROOT"
          cp -r "$ROOT"/. .

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Generer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew executable
        run: chmod +x ./gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
